<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mi Contrato</title>
<link rel="icon" href="assets/img/icon-favicon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#001753" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="OSPAN" />
<link rel="apple-touch-icon" href="assets/img/icon-apple-touch-favicon.png" />

<link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/utilities.css" />
</head>
<body>

  <header class="page-header">
    <a class="back-link" href="afil-perfil.html" aria-label="Volver">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="page-title">Mi Contrato</h1>
  </header>

  <main class="page-body">

    <div class="info-note mb-8">
      <span class="ic sz-sm rnd-sm tint-sky">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/></svg>
      </span>
      <div>
        <p class="info-note-title">Contrato firmado digitalmente</p>
        <p class="info-note-text">Este es el contrato que aceptaste al asociarte a OSPAN desde la app.</p>
      </div>
    </div>

    <div class="field-card mb-8">
      <div class="field-row">
        <span class="field-label">Código</span>
        <span class="field-value" id="contrato-codigo">—</span>
      </div>
      <div class="field-row">
        <span class="field-label">Fecha de firma</span>
        <span class="field-value" id="contrato-fecha-firma">—</span>
      </div>
      <div class="field-row">
        <span class="field-label">Vigencia</span>
        <span class="field-value" id="contrato-vigencia">—</span>
      </div>
      <div class="field-row field-row--align-start">
        <span class="field-label">Planes asociados</span>
        <span class="field-value field-value--pills" id="contrato-planes">—</span>
      </div>
    </div>

    <button class="cta-button cta-button--primary cta-button--icon" type="button" id="contrato-descargar" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Descargar PDF
    </button>
    <p class="form-security-note" id="contrato-nota">El PDF firmado todavía no está disponible para descarga.</p>

  </main>

  <nav class="tab-bar" id="tab-bar-mount"></nav>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/tab-bar.js"></script>
  <script src="assets/js/screen-contrato.js"></script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
