<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mis Resultados</title>
<link rel="icon" href="assets/img/icon-favicon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#001753" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="OSPAN" />
<link rel="apple-touch-icon" href="assets/img/icon-apple-touch-favicon.png" />

<link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/utilities.css" />
  <link rel="stylesheet" href="assets/css/resultados.css" />
</head>
<body>

  <header class="page-header">
    <a class="back-link" href="afil-home.html" aria-label="Volver">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="page-title">Mis Resultados</h1>
  </header>

  <main class="page-body">

    <div class="pet-selector" id="pet-selector" role="tablist" aria-label="Elegí una mascota"></div>

    <div class="info-note mb-6" id="resultados-nota">
      <span class="ic sz-sm rnd-sm tint-sky">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></svg>
      </span>
      <div>
        <p class="info-note-title">Estudios y análisis</p>
        <p class="info-note-text">Acá vas a ver las órdenes médicas de tu mascota (laboratorio, imágenes, etc.) y sus resultados, tal como los carga la veterinaria.</p>
      </div>
    </div>

    <div class="list-section-header">
      <h2 class="list-section-title" id="resultados-title">Órdenes</h2>
      <span class="list-section-count" id="resultados-count">—</span>
    </div>

    <div class="filter-chips" id="filter-chips">
      <button class="filter-chip is-active" type="button" data-filter="todas">Todas</button>
      <button class="filter-chip" type="button" data-filter="con-resultado">Con resultado</button>
      <button class="filter-chip" type="button" data-filter="pendientes">Pendientes</button>
    </div>

    <div class="record-list" id="ordenes-list">
      <p class="empty-state">Cargando…</p>
    </div>

  </main>

  <nav class="tab-bar" id="tab-bar-mount"></nav>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/tab-bar.js"></script>
  <script src="assets/js/resultados-utils.js"></script>
  <script src="assets/js/screen-resultados.js"></script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
