<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Reintegros</title>
<link rel="icon" href="assets/img/icon-favicon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#001753" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="OSPAN" />
<link rel="apple-touch-icon" href="assets/img/icon-apple-touch-favicon.png" />
<link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/utilities.css" />
  <link rel="stylesheet" href="assets/css/resultados.css" />
</head>
<body>

  <header class="page-header">
    <a class="back-link" href="afil-home.html" aria-label="Volver">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="page-title">Reintegros</h1>
  </header>

  <main class="page-body">

    <button class="cta-button cta-button--primary mb-6" type="button" id="nueva-btn">+ Cargar nuevo reintegro</button>

    <form class="form-panel hidden" id="form-panel">
      <p class="form-panel-title">Solicitud de reintegro</p>

      <div class="form-group">
        <label class="form-label" for="f-mascota">Mascota</label>
        <select class="form-input" id="f-mascota" required></select>
      </div>
      <div class="form-group">
        <label class="form-label" for="f-tipo">Tipo de prestación</label>
        <select class="form-input" id="f-tipo" required>
          <option value="">Seleccionar…</option>
          <option>Consulta</option>
          <option>Medicación</option>
          <option>Estudios</option>
          <option>Cirugía</option>
          <option>Urgencia</option>
          <option>Otro</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="f-desc">Descripción</label>
        <input class="form-input" type="text" id="f-desc" placeholder="Ej: consulta dermatológica fuera de cartilla" />
      </div>
      <div class="form-group">
        <label class="form-label" for="f-monto">Monto total</label>
        <input class="form-input" type="number" id="f-monto" min="1" step="0.01" placeholder="0" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="f-fecha">Fecha de la prestación</label>
        <input class="form-input" type="date" id="f-fecha" required />
      </div>

      <div class="form-group">
        <label class="form-label">Comprobantes</label>
        <label class="dropzone" for="f-archivos">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span>Tocá para adjuntar foto o PDF</span>
          <small>Hasta 4 archivos, 5 MB cada uno</small>
        </label>
        <input type="file" id="f-archivos" accept="image/*,application/pdf" multiple hidden />
        <div class="archivo-list" id="archivo-list"></div>
      </div>

      <p class="form-security-note text-red hidden" id="form-error"></p>
      <button class="cta-button cta-button--primary" type="submit" id="enviar-btn">Enviar solicitud</button>
      <button class="cta-button cta-button--outline mt-2" type="button" id="cancelar-btn">Cancelar</button>
    </form>

    <div class="list-section-header">
      <h2 class="list-section-title">Mis reintegros</h2>
      <span class="list-section-count" id="conteo">—</span>
    </div>
    <div class="record-list" id="lista"></div>

  </main>

  <nav class="tab-bar" id="tab-bar-mount"></nav>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/app-shell.js"></script>
  <script src="assets/js/tab-bar.js"></script>
  <script src="assets/js/screen-reintegros.js"></script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
